name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and validate audio helper
        shell: pwsh
        run: |
          cmake -S audio-service -B audio-service/build-ci -A x64
          cmake --build audio-service/build-ci --config Release
          node scripts/validate-audio-helper.mjs audio-service/build-ci/Release/voicecraft-audio.exe
          New-Item -ItemType Directory -Force resources/bin | Out-Null
          Copy-Item audio-service/build-ci/Release/voicecraft-audio.exe resources/bin/voicecraft-audio.exe -Force

      - name: Build release artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: npm run build

      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = node -p "require('./package.json').version"
          $installer = "release/VoiceCraft-Setup-$version.exe"
          $blockmap = "$installer.blockmap"
          $metadata = "release/latest.yml"
          $required = @($installer, $blockmap, $metadata)
          foreach ($asset in $required) {
            if (-not (Test-Path -LiteralPath $asset)) {
              Write-Error "Missing release artifact: $asset"
              exit 1
            }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "VoiceCraft $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag $installer $blockmap $metadata --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = node -p "require('./package.json').version"
          $expected = @(
            "VoiceCraft-Setup-$version.exe",
            "VoiceCraft-Setup-$version.exe.blockmap",
            "latest.yml"
          )
          $assets = @(gh release view $tag --json assets --jq '.assets[].name')
          foreach ($name in $expected) {
            if ($assets -notcontains $name) {
              Write-Error "Missing release asset: $name"
              exit 1
            }
          }
          Write-Host "OK: installer, blockmap, and latest.yml uploaded."